<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;600;700&display=swap">

<style id="css">
/* Layout: bitta ustun; yuqorida umumiy holat, pastda har bir maqsad kartasi va bajarilganlar jurnali */
:root{
  --bg:#f3f1ea; --surface:#fffdf7; --ink:#14231f; --muted:#5d6b66; --line:#dcd8cb;
  --deep:#123b33; --gold:#b8862b; --gold-soft:#efe1c0; --track:#e7e3d6; --ok:#2f7d4f; --gold-deep:#8a5f17; --ok-deep:#1f5c39;
  --display:"Bricolage Grotesque",Georgia,serif; --body:"Manrope",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#16211e; --ink:#ecebe3; --muted:#9aa8a2; --line:#2a3833;
  --deep:#cfe6dc; --gold:#e0b45a; --gold-soft:#3a3120; --track:#24312d; --ok:#6cc391; --gold-deep:#a8792a; --ok-deep:#3f9765; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#16211e; --ink:#ecebe3; --muted:#9aa8a2; --line:#2a3833;
  --deep:#cfe6dc; --gold:#e0b45a; --gold-soft:#3a3120; --track:#24312d; --ok:#6cc391; --gold-deep:#a8792a; --ok-deep:#3f9765; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;color:var(--deep)}
h1{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
h2{font-size:20px;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}
.summary{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.ring{width:120px;height:120px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.stat b{display:block;font-family:var(--display);font-size:24px;color:var(--deep)}
.stat > span{font-size:13px;color:var(--muted)}
.cnt{font:inherit;color:inherit}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.goal.done{border-color:var(--ok)}
.gtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gname{font-weight:700;font-size:17px}
.gidx{font-family:var(--display);color:var(--gold);font-size:14px;margin-right:6px}
.pct{font-family:var(--display);font-weight:800;font-size:22px;color:var(--deep)}
.goal.done .pct{color:var(--ok)}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.goal.done .bar i{background:var(--ok)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.meta strong{color:var(--ink)}
.log{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 16px}
.log ul{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:104px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.log li:last-child{border-bottom:0}
.log .d{color:var(--muted)}
.log .q{color:var(--ok);font-weight:700}
.empty{color:var(--muted);padding:12px 0;font-size:14px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--deep);color:var(--bg);border-color:var(--deep)}
button.gold{background:var(--gold);color:#1b1407;border-color:var(--gold)}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.form .full{grid-column:1/-1}
.add{display:grid;grid-template-columns:90px 1fr auto;gap:6px;padding-top:8px;border-top:1px dashed var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--deep);color:var(--bg);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.savebar button{background:var(--gold);color:#1b1407;border-color:var(--gold)}
.note{font-size:13px;color:var(--muted)}
.del{background:none;border:0;color:var(--muted);padding:4px;font-size:13px}
.seg{display:inline-flex;background:var(--track);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--deep);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tanks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 16px}
.tank{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
.tpct{font-family:var(--display);font-weight:800;font-size:20px;color:var(--deep);line-height:1}
.tank.full .tpct{color:var(--ok)}
.glass{position:relative;width:min(74px,100%);height:210px;border:2px solid var(--line);border-radius:14px 14px 22px 22px;background:var(--bg);overflow:hidden}
.glass .tick{position:absolute;left:0;width:9px;border-top:1px solid var(--line)}
.glass .tick span{position:absolute;left:12px;top:-8px;font-size:10px;color:var(--muted)}
.liquid{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--gold),var(--gold-deep))}
.tank.full .liquid{background:linear-gradient(180deg,var(--ok),var(--ok-deep))}
.liquid.some{min-height:6px}
.wave{position:absolute;left:0;top:-9px;width:200%;height:10px;color:var(--gold)}
.tank.full .wave{color:var(--ok)}
.wave path{fill:currentColor}
@media (prefers-reduced-motion:no-preference){.wave{animation:drift 3.2s linear infinite}.liquid{transition:height 1s cubic-bezier(.2,.8,.2,1)}}
@keyframes drift{to{transform:translateX(-50%)}}
.tname{font-weight:700;font-size:14px;line-height:1.2}
.tcount{font-size:12px;color:var(--muted);line-height:1.3}
.tcount b{color:var(--ink)}
.rank{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.rrow{display:grid;grid-template-columns:96px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.rrow .rn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtrack{height:14px;background:var(--track);border-radius:99px;overflow:hidden;position:relative}
.rtrack i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold-deep),var(--gold));border-radius:99px}
.rrow.full .rtrack i{background:linear-gradient(90deg,var(--ok-deep),var(--ok))}
.rrow .rp{text-align:right;font-weight:700;color:var(--deep)}
@media (max-width:600px){.tanks{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 8px;padding:18px 10px}.glass{height:150px;border-radius:10px 10px 16px 16px}.tpct{font-size:16px}.tname{font-size:12px}.tcount{font-size:11px}.glass .tick span{display:none}.rrow{grid-template-columns:76px 1fr 46px}}
.rose{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.rose svg{width:100%;max-width:560px;height:auto;overflow:visible}
.rose .lbl{font-family:var(--body);font-size:13px;font-weight:700;fill:var(--ink)}
.rose .lblp{font-family:var(--display);font-size:13px;font-weight:800;fill:var(--gold)}
.rose .full .lblp{fill:var(--ok)}
.rose .petal{fill:url(#gGold)}
.rose .full .petal{fill:url(#gOk)}
.rose .trackp{fill:var(--track)}
.rose .ring0{fill:none;stroke:var(--line);stroke-dasharray:2 4}
.rose .hint{font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.rose .petal{transform-origin:200px 200px;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}}
@keyframes grow{from{transform:scale(.2);opacity:0}}
.lx{background:none;border:0;color:var(--muted);padding:0 4px;font-size:16px;line-height:1}
.lx:hover{color:var(--ink)}
.loading{display:flex;align-items:center;justify-content:center;gap:12px;min-height:60vh;color:var(--muted);font-weight:600}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--gold);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){.intro .ringfg{animation:ringin 1.4s cubic-bezier(.2,.8,.2,1) both}.intro .bar i{animation:barin 1.4s cubic-bezier(.2,.8,.2,1) both}}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}
@keyframes barin{from{width:0}}
.ebanner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.ebox{display:grid;grid-template-columns:minmax(0,1fr) 48px 48px;grid-template-areas:"q add sub" "s cur cur";gap:8px}
.ebox .q{grid-area:q}.ebox .btn-add{grid-area:add}.ebox .btn-sub{grid-area:sub}.ebox .s{grid-area:s;min-height:42px}.ebox .cur{grid-area:cur}
select.cur{font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:0 6px;min-height:42px;width:100%}
.eform select.cur{width:96px}
input.need{border-color:#b42318;box-shadow:0 0 0 2px rgba(180,35,24,.15)}
.lsum{color:var(--gold-deep);font-weight:600;white-space:nowrap}
.ebl{font-size:13px;font-weight:700;color:var(--gold-deep)}
.bignum{font-size:18px;font-weight:700;min-height:46px}
.ebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-add,.btn-sub,.btn-del,.btn-chip{min-height:46px;font-weight:700;border-radius:10px}
.btn-add,.btn-sub{padding:0;font-size:24px;line-height:1}
.btn-add{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn-sub{background:var(--surface);color:var(--ink);border:1px solid var(--muted)}
.btn-del{width:100%;background:var(--surface);color:#b42318;border:1px solid #d9a19b}
details.cfg summary{list-style:none;cursor:pointer;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface)}
details.cfg summary::-webkit-details-marker{display:none}
details.cfg[open] summary{border-color:var(--gold)}
.lacts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.btn-chip{min-height:40px;padding:6px 14px;font-size:14px;background:var(--surface);border:1px solid var(--gold);color:var(--ink)}
.btn-chip.red{border-color:#d9a19b;color:#b42318}
.savebar.ok{background:var(--ok)}.savebar.err{background:#b42318}.savebar.wait{background:var(--deep)}
.lbtns{display:inline-flex;gap:6px;margin-left:10px;vertical-align:middle}
.lbtn{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--gold);background:var(--surface);color:var(--gold-deep)}
.lbtn.danger{border-color:#d9a19b;color:#b42318}
.lbtn:hover{background:var(--gold-soft)}
.log li.ledit{display:flex;flex-direction:column;gap:10px;background:var(--gold-soft);margin:0 -16px;padding:14px 16px}
.eform{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.eform label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.eform label input{min-height:42px;width:130px;font-weight:700}
.eform label.grow{flex:1 1 180px}.eform label.grow input{width:100%}
button.big{min-height:42px}
#tog:not(.primary){background:var(--gold);color:#1b1407;border-color:var(--gold)}
.add.sub{grid-template-columns:90px 1fr auto auto}
@media (max-width:520px){.rose .lbl,.rose .lblp{font-size:15px}}
.rings{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:center}
.rings svg{width:100%;height:auto;display:block}
.rings .rl{font-family:var(--body);font-size:12.5px;font-weight:700;fill:var(--ink)}
.rings .arc{fill:none;stroke-linecap:round;stroke:url(#rGold)}
.rings .full .arc{stroke:url(#rOk)}
.rings .rt{fill:none;stroke:var(--track)}
.rings .tk{font-size:10px;fill:var(--muted)}
.rlegend{display:flex;flex-direction:column;gap:10px;min-width:0}
.rli{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.rli:last-child{border-bottom:0}
.rli .ix{font-family:var(--display);color:var(--gold);font-weight:800}
.rli .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rli .sub{grid-column:2/-1;font-size:12px;color:var(--muted);margin-top:-6px}
.rli .pv{font-family:var(--display);font-weight:800;color:var(--deep)}
.rli.full .pv{color:var(--ok)}
@media (prefers-reduced-motion:no-preference){.rings .arc{animation:sweep 1.1s cubic-bezier(.2,.8,.2,1) both}}
@keyframes sweep{from{stroke-dashoffset:var(--len)}}
@media (max-width:640px){.rings{grid-template-columns:1fr}}
@media (max-width:520px){.summary{grid-template-columns:1fr;justify-items:center;text-align:center}.log li{grid-template-columns:1fr auto}.log .d{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .6s ease}}
</style>

<body>
<div id="app"></div>
<!-- Zaxira ma'lumot: Supabase ulanmaguncha yoki ishlamay qolsa shu ko'rsatiladi -->
<script type="application/json" id="state">{"title":"Katta maqsadlar","goals":[{"name":"Tolibi ilm","unit":"talaba","target":1000,"budget":100,"done":0},{"name":"Yo'l","unit":"yo'l","target":1000,"budget":75,"done":0},{"name":"Hodim","unit":"kishi","target":1000,"budget":0,"done":25},{"name":"Uy","unit":"uy","target":100,"budget":4,"done":0},{"name":"Hoji","unit":"kishi","target":100,"budget":1,"done":0},{"name":"Ko'prik","unit":"ko'prik","target":100,"budget":40,"done":0},{"name":"Masjid","unit":"masjid","target":10,"budget":100,"done":0},{"name":"Ehson","unit":"kishi","target":100000,"budget":100,"done":0}],"log":[{"d":"2026-10-11","g":"Hodim","n":25,"note":""},{"d":"2026-10-12","g":"Tolibi ilm","n":59,"note":""},{"d":"2026-10-12","g":"Tolibi ilm","n":600,"note":""}]}</script>
<script>
(function(){
const SAVED = JSON.parse(document.getElementById('state').textContent);
let S = JSON.parse(JSON.stringify(SAVED));
let canEdit = false, editing = false, dirty = false, saving = false, msg = '', editK = null, saveErr = '', saveTimer = null, ready = false, intro = false;
let lastCur = '$'; try{ lastCur = localStorage.getItem('maqsad-cur') || '$'; }catch(e){}
const CURS = ['$','so‘m'];
const num = v => { const x = parseFloat(String(v||'').replace(/[\s\u00a0]/g,'').replace(',','.')); return isFinite(x) ? x : NaN; };
const money = (v,c) => fmt(Math.round(Math.abs(v)*100)/100) + ' ' + (c||'$');
const curSel = (id,cur) => `<select id="${id}" class="cur" aria-label="Valyuta">${CURS.map(c=>`<option${c===cur?' selected':''}>${c}</option>`).join('')}</select>`;
function spent(name){ const t={}; S.log.forEach(e=>{ if(e.g===name && e.s){ const c=e.cur||'$'; t[c]=(t[c]||0)+e.s; } }); return Object.keys(t).filter(c=>t[c]).map(c=>money(t[c],c)).join(' · '); }
let sb = null, user = null, loginOpen = false;
const CFG = window.MAQSAD_CONFIG || {};
let view = 'rose'; try{ view = localStorage.getItem('maqsad-view') || 'rose'; }catch(e){}
const app = document.getElementById('app');
const fmt = n => Number(n||0).toLocaleString('ru-RU').replace(/,/g,' ');
const pct = g => g.target>0 ? Math.min(100, g.done/g.target*100) : 0;
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const p1 = v => (Math.round(v*10)/10).toString().replace('.',',');

function ringsHTML(gs){
  const n = gs.length, cx=210, cy=210, Rout=190, sw = Math.max(8, Math.min(16, 150/Math.max(n,1) - 4)), step = sw+4, SWEEP = 1.5*Math.PI;
  const pt=(r,a)=>[cx+r*Math.sin(a), cy-r*Math.cos(a)];
  const arc=(r,a)=>{ if(a<=0) return ''; const [x1,y1]=pt(r,0),[x2,y2]=pt(r,Math.min(a,SWEEP-1e-4)); return `M${x1.toFixed(2)} ${y1.toFixed(2)}A${r} ${r} 0 ${a>Math.PI?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`; };
  let svg = `<svg viewBox="0 0 420 420" role="img" aria-label="Maqsadlar halqa diagrammasi">
  <defs><linearGradient id="rGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--gold)"/><stop offset="1" stop-color="var(--gold-deep)"/></linearGradient>
  <linearGradient id="rOk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--ok)"/><stop offset="1" stop-color="var(--ok-deep)"/></linearGradient></defs>`;
  [0.25,0.5,0.75].forEach(f=>{ const a=SWEEP*f, [x1,y1]=pt(Rout+sw/2+2,a), [x2,y2]=pt(Rout-(n-1)*step-sw/2-2,a);
    svg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--line)" stroke-dasharray="2 3"/>`;
    const [tx,ty]=pt(Rout+sw/2+12,a); svg += `<text class="tk" x="${tx.toFixed(1)}" y="${(ty+3).toFixed(1)}" text-anchor="middle">${f*100}%</text>`; });
  gs.forEach((g,i)=>{
    const r = Rout - i*step, p = pct(g), a = SWEEP*p/100, len = (r*a).toFixed(1);
    svg += `<g class="${p>=100?'full':''}"><title>${esc(g.name)}: ${fmt(g.done)} / ${fmt(g.target)} ${esc(g.unit)} (${p1(p)}%)</title>
      <path class="rt" stroke-width="${sw}" stroke-linecap="round" d="${arc(r,SWEEP)}"/>
      ${p>0?`<path class="arc" stroke-width="${sw}" stroke-dasharray="${len} ${len}" style="--len:${len};animation-delay:${i*80}ms" d="${arc(r,Math.max(a,0.02))}"/>`:''}
      <text class="rl" x="${cx-10}" y="${(cy-r+4.5).toFixed(1)}" text-anchor="end">${esc(g.name)}</text></g>`;
  });
  const avg = n ? gs.reduce((s,g)=>s+pct(g),0)/n : 0;
  svg += `<text x="${cx+8}" y="${cy+8}" text-anchor="start" fill="var(--deep)" font-family="Bricolage Grotesque, Georgia, serif" font-weight="800" font-size="30">${p1(avg)}%</text>
    <text x="${cx+8}" y="${cy+26}" text-anchor="start" fill="var(--muted)" font-size="11">umumiy</text></svg>`;
  let leg = '<div class="rlegend">';
  gs.forEach((g,i)=>{ const p=pct(g);
    leg += `<div class="rli ${p>=100?'full':''}"><span class="ix">${i+1}</span><span class="nm">${esc(g.name)}</span><span class="pv num">${p1(p)}%</span>
      <span class="sub num">${fmt(g.done)} / ${fmt(g.target)} ${esc(g.unit)} · qoldi ${fmt(Math.max(0,g.target-g.done))}</span></div>`; });
  leg += '</div>';
  return `<section style="display:flex;flex-direction:column;gap:12px"><div class="rings">${svg}${leg}</div></section>`;
}

function roseHTML(gs){
  const n = gs.length, cx=200, cy=200, r0=46, R=150, gap=0.06;
  const pt=(r,a)=>[cx+r*Math.sin(a), cy-r*Math.cos(a)];
  const sector=(r1,r2,a1,a2)=>{const [x1,y1]=pt(r2,a1),[x2,y2]=pt(r2,a2),[x3,y3]=pt(r1,a2),[x4,y4]=pt(r1,a1);const lg=(a2-a1)>Math.PI?1:0;
    return `M${x1.toFixed(1)} ${y1.toFixed(1)}A${r2} ${r2} 0 ${lg} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}L${x3.toFixed(1)} ${y3.toFixed(1)}A${r1} ${r1} 0 ${lg} 0 ${x4.toFixed(1)} ${y4.toFixed(1)}Z`;};
  const avg = n ? gs.reduce((a,g)=>a+pct(g),0)/n : 0;
  let svg = `<svg viewBox="-70 -30 540 460" role="img" aria-label="Maqsadlar gul diagrammasi, umumiy ${p1(avg)} foiz">
  <defs><radialGradient id="gGold" cx="200" cy="200" r="150" gradientUnits="userSpaceOnUse"><stop offset="0.3" stop-color="var(--gold-deep)"/><stop offset="1" stop-color="var(--gold)"/></radialGradient>
  <radialGradient id="gOk" cx="200" cy="200" r="150" gradientUnits="userSpaceOnUse"><stop offset="0.3" stop-color="var(--ok-deep)"/><stop offset="1" stop-color="var(--ok)"/></radialGradient></defs>`;
  [0.25,0.5,0.75,1].forEach(f=>{ svg += `<circle class="ring0" cx="${cx}" cy="${cy}" r="${r0+(R-r0)*f}"/>`; });
  gs.forEach((g,i)=>{
    const p = pct(g), a1 = i*2*Math.PI/n + gap, a2 = (i+1)*2*Math.PI/n - gap, am=(a1+a2)/2;
    const rf = r0 + (R-r0)*(p>0?Math.max(p,3):0)/100;
    const [lx,ly] = pt(R+22, am), s = Math.sin(am);
    const anchor = Math.abs(s)<0.2?'middle':(s>0?'start':'end');
    const dy = Math.cos(am)>0.6?-10:(Math.cos(am)<-0.6?14:0);
    svg += `<g class="${p>=100?'full':''}"><title>${esc(g.name)}: ${fmt(g.done)} / ${fmt(g.target)} ${esc(g.unit)} (${p1(p)}%)</title>
      <path class="trackp" d="${sector(r0,R,a1,a2)}"/>
      ${p>0?`<path class="petal" style="animation-delay:${i*70}ms" d="${sector(r0,rf,a1,a2)}"/>`:''}
      <text class="lbl" x="${lx.toFixed(1)}" y="${(ly+dy).toFixed(1)}" text-anchor="${anchor}">${esc(g.name)}</text>
      <text class="lblp num" x="${lx.toFixed(1)}" y="${(ly+dy+16).toFixed(1)}" text-anchor="${anchor}">${p1(p)}%</text></g>`;
  });
  svg += `<circle cx="${cx}" cy="${cy}" r="${r0-6}" fill="var(--surface)" stroke="var(--line)"/>
  <text x="${cx}" y="${cy+2}" text-anchor="middle" fill="var(--deep)" font-family="Bricolage Grotesque, Georgia, serif" font-weight="800" font-size="20">${p1(avg)}%</text>
  <text x="${cx}" y="${cy+18}" text-anchor="middle" fill="var(--muted)" font-size="10">umumiy</text></svg>`;
  return `<section style="display:flex;flex-direction:column;gap:12px"><div class="rose">${svg}
    <p class="hint">Har bir yaproq bitta maqsad. Ish bajarilgan sari yaproq markazdan tashqariga qarab to‘ladi.</p></div></section>`;
}

function tanksHTML(gs){
  const wave = '<svg class="wave" viewBox="0 0 200 10" preserveAspectRatio="none" aria-hidden="true"><path d="M0 5 Q12.5 0 25 5 T50 5 T75 5 T100 5 T125 5 T150 5 T175 5 T200 5 V10 H0Z"/></svg>';
  let h = `<section style="display:flex;flex-direction:column;gap:12px"><div class="tanks">`;
  gs.forEach((g,i)=>{
    const p = pct(g), full = p>=100;
    h += `<div class="tank ${full?'full':''}" role="img" aria-label="${esc(g.name)}: ${p1(p)} foiz">
      <div class="tpct num">${p1(p)}%</div>
      <div class="glass">
        <div class="tick" style="bottom:75%"><span>75</span></div><div class="tick" style="bottom:50%"><span>50</span></div><div class="tick" style="bottom:25%"><span>25</span></div>
        <div class="liquid ${p>0?'some':''}" style="height:${p}%">${p>0?wave:''}</div>
      </div>
      <div class="tname">${esc(g.name)}</div>

    </div>`;
  });
  h += `</div></section><section style="display:flex;flex-direction:column;gap:12px"><div class="rank">`;
  gs.map((g,i)=>({g,p:pct(g)})).sort((a,b)=>b.p-a.p).forEach(({g,p})=>{
    h += `<div class="rrow ${p>=100?'full':''}"><span class="rn">${esc(g.name)}</span><div class="rtrack"><i style="width:${p>0?Math.max(p,1.5):0}%"></i></div><span class="rp num">${p1(p)}%</span></div>`;

  return h + `</div></section>`;
}

function cnt(v, kind, suffix, tag){
  tag = tag || 'span';
  const show = x => (kind==='p1' ? p1(x) : fmt(Math.round(x))) + (suffix||'');
  return intro ? `<${tag} class="cnt" data-to="${v}" data-k="${kind}" data-s="${esc(suffix||'')}">${show(0)}</${tag}>` : show(v);
}
function runCounters(){
  const els = [...app.querySelectorAll('.cnt')]; if(!els.length) return;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduce ? 0 : 1400, t0 = performance.now();
  const step = now => {
    const t = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - Math.pow(1 - t, 3);
    els.forEach(el => { const to = +el.dataset.to, x = to * e, s = el.dataset.s || '';
      el.textContent = (el.dataset.k==='p1' ? p1(x) : fmt(Math.round(x))) + s; });
    if(t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function render(){

  ${canEdit ? `<button id="tog" class="${editing?'primary':''}">${editing?'✓ Tahrirlashni tugatish':'✏️ Tahrirlash'}</button>`:''}</div></div>

      <circle class="ringfg" style="--c:${C}" cx="60" cy="60" r="52" fill="none" stroke="var(--gold)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 60 60)"/>
      <text x="60" y="66" text-anchor="middle" fill="var(--deep)" font-family="Bricolage Grotesque, Georgia, serif" font-weight="800" font-size="22">${cnt(avg,'p1','%','tspan')}</text>
    </svg>
    <div class="stats">
      <div class="stat"><b class="num">${cnt(avg,'p1','%')}</b><span>umumiy bajarilish</span></div>
      <div class="stat"><b class="num">${cnt(budget,'int',' mln $')}</b><span>umumiy byudjet</span></div>
      <div class="stat"><b class="num">${cnt(value,'p1',' mln $')}</b><span>bajarilgan qism qiymati</span></div>
      <div class="stat"><b class="num">${cnt(fin,'int')} / ${gs.length}</b><span>to‘liq bajarilgan</span></div>
    </div>
  </section>
`;
  if(view==='rings' && !editing){ h += ringsHTML(gs); } else if(view==='rose' && !editing){ h += roseHTML(gs); } else if(view==='tanks' && !editing){ h += tanksHTML(gs); } else {
  h += `<section style="display:flex;flex-direction:column;gap:12px"><h2>Maqsadlar</h2><div class="goals">`;
  gs.forEach((g,i)=>{
    const p = pct(g), left = Math.max(0,g.target-g.done);
    h += `<article class="goal ${p>=100?'done':''}">
      <div class="gtop"><div class="gname"><span class="gidx">${i+1}</span>${esc(g.name)}</div><div class="pct num">${cnt(p,'p1','%')}</div></div>
      <div class="bar"><i style="width:${p}%"></i></div>
      <div class="meta num"><span>Bajarildi: <strong>${cnt(g.done,'int')}</strong> / ${fmt(g.target)} ${esc(g.unit)}</span><span>Qoldi: <strong>${cnt(left,'int')}</strong></span></div>
      <div class="meta num"><span>${g.budget?`Byudjet: <strong>${fmt(g.budget)} mln $</strong>`:'Byudjet belgilanmagan'}</span></div>${spent(g.name)?`
      <div class="meta num"><span>Sarflandi: <strong>${spent(g.name)}</strong></span></div>`:''}`;
    if(editing){
      h += `<div class="ebox">
        <input id="q${i}" class="bignum q" type="number" min="1" inputmode="numeric" placeholder="Soni" aria-label="${esc(g.name)}: soni (majburiy)">
        <button class="btn-add" data-act="add" data-i="${i}" aria-label="Qo‘shish" title="Qo‘shish">+</button>
        <button class="btn-sub" data-act="sub" data-i="${i}" aria-label="Ayirish" title="Ayirish">−</button>
        <input id="s${i}" class="s" type="text" inputmode="decimal" placeholder="Summa (ixtiyoriy)" aria-label="${esc(g.name)}: summa (ixtiyoriy)">
        ${curSel('c'+i, lastCur)}
      </div>
      <details class="cfg"><summary>⚙ Maqsad sozlamalari</summary>
      <div class="form" style="margin-top:10px">
        <label class="full">Nomi<input id="fn${i}" value="${esc(g.name)}" data-f="name" data-i="${i}"></label>
        <label>Maqsad (soni)<input id="ft${i}" type="number" min="0" value="${g.target}" data-f="target" data-i="${i}"></label>
        <label>Birligi<input id="fu${i}" value="${esc(g.unit)}" data-f="unit" data-i="${i}"></label>
        <label>Byudjet (mln $)<input id="fb${i}" type="number" min="0" step="any" value="${g.budget}" data-f="budget" data-i="${i}"></label>
        <label>Bajarildi (jami)<input id="fd${i}" type="number" min="0" value="${g.done}" data-f="done" data-i="${i}"></label>
        <div class="full"><button class="btn-del" data-act="rm" data-i="${i}">🗑 Bu maqsadni butunlay o‘chirish</button></div>
      </div></details>`;
    }
    h += `</article>`;
  });
  h += `</div>${editing?`<div class="row"><button data-act="new">+ Yangi maqsad</button></div>`:''}</section>`; }
  h += `<section style="display:flex;flex-direction:column;gap:12px"><h2>Bajarilganlar jurnali</h2><div class="log">`;
  if(!S.log.length) h += `<div class="empty">Hali hech narsa qayd etilmagan. Biror ish bajarilganda shu yerda sanasi bilan ko‘rinadi.</div>`;
  else { h += '<ul>'; S.log.map((e,k)=>({e,k})).reverse().slice(0,60).forEach(({e,k})=>{
    if(editing && editK===k){
      h += `<li class="ledit"><div class="ehead"><b>${esc(e.g)}</b> <span class="note">· hozir yozilgan: ${e.n<0?'−':'+'}${fmt(Math.abs(e.n))}</span></div>
        <div class="eform">
          <label>Soni<input id="el-n" type="number" min="1" value="${Math.abs(e.n)}"></label>

          <label>Valyuta${curSel('el-c', e.cur||lastCur)}</label>
          <label>Sana<input id="el-d" type="date" value="${esc(e.d)}"></label>

  h += `</div></section>`;

  if(editing){

    h += `<div class="savebar ${st[0]}" role="status"><span>${st[1]}${msg&&!saveErr?' · '+esc(msg):''}</span>${saveErr?`<button id="save">Qayta urinish</button>`:''}</div>`;
  }
  h += `</div>`;
  app.innerHTML = h;
  if(intro){ intro = false; runCounters(); }
}

app.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.view){ view=b.dataset.view; try{ localStorage.setItem('maqsad-view',view); }catch(e){} if(editing&&view!=='cards') editing=false; render(); return; }
  if(b.id==='tog'){ if(editing && (dirty||saving)){ save(); } editing=!editing; editK=null; render(); return; }
  if(b.id==='save'){ save(); return; }
  const i = +b.dataset.i, act = b.dataset.act;
  if(act==='add'||act==='sub'){
    const qi = document.getElementById('q'+i), si = document.getElementById('s'+i);
    let q = parseInt(qi.value,10);
    if(!(q>0)){ qi.classList.add('need'); qi.focus(); return; }
    const sv = si.value.trim(), amt = sv ? num(sv) : 0;
    if(sv && !(amt>0)){ si.classList.add('need'); si.focus(); return; }
    const cur = document.getElementById('c'+i).value; lastCur = cur; try{ localStorage.setItem('maqsad-cur',cur); }catch(e){}
    if(act==='sub') q = -Math.min(q, S.goals[i].done);
    if(q===0) return;
    S.goals[i].done += q;
    const entry = {d:today(), g:S.goals[i].name, n:q, note:''};
    if(amt>0){ entry.s = q<0 ? -amt : amt; entry.cur = cur; }
    S.log.push(entry);
    changed(`${S.goals[i].name}: ${q>0?'+':'−'}${fmt(Math.abs(q))}${amt>0?' · '+money(amt,cur):''}`);
  } else if(act==='editlog'){
    editK = +b.dataset.k; render();
    const el = document.getElementById('el-n'); if(el){ el.focus(); el.select(); }
  } else if(act==='cancellog'){
    editK = null; render();
  } else if(act==='savelog'){
    const k = +b.dataset.k, e2 = S.log[k]; if(!e2) return;
    const inp = document.getElementById('el-n');
    const abs = parseInt(inp.value,10);
    if(!(abs>0)){ inp.focus(); return; }
    const newN = e2.n<0 ? -abs : abs, delta = newN - e2.n;
    const g = S.goals.find(x=>x.name===e2.g);
    if(g) g.done = Math.max(0, g.done + delta);
    e2.n = newN;
    const sv = document.getElementById('el-s').value.trim(), amt = sv ? num(sv) : 0;
    if(sv && !(amt>0)){ document.getElementById('el-s').focus(); return; }
    if(amt>0){ e2.s = newN<0 ? -amt : amt; e2.cur = document.getElementById('el-c').value; } else { delete e2.s; delete e2.cur; }
    const d = document.getElementById('el-d').value; if(d) e2.d = d;
    e2.note = document.getElementById('el-note').value.trim();
    editK = null; changed(`${e2.g}: tuzatildi`);
  } else if(act==='unlog'){
    const k = +b.dataset.k, e2 = S.log[k]; if(!e2) return;
    if(!confirm(`“${e2.g}” uchun ${e2.n>0?'+':'−'}${fmt(Math.abs(e2.n))} yozuvini o‘chiraymi?\nMaqsaddagi raqam ham shunga qarab kamayadi.`)) return;
    const g = S.goals.find(x=>x.name===e2.g);
    if(g) g.done = Math.max(0, g.done - e2.n);
    S.log.splice(k,1); editK=null; changed(`${e2.g}: yozuv o‘chirildi`);
  } else if(act==='rm'){
    if(!confirm(`“${S.goals[i].name}” maqsadini butunlay o‘chiraymi?`)) return;
    const nm = S.goals[i].name; S.goals.splice(i,1); changed(`${nm} o‘chirildi`);
  } else if(act==='new'){
    S.goals.push({name:'Yangi maqsad',unit:'dona',target:100,budget:0,done:0}); changed('Yangi maqsad qo‘shildi');
  }
});
app.addEventListener('input', e=>{ e.target.classList && e.target.classList.remove('need'); });
app.addEventListener('keydown', e=>{ const m=/^[qs](\d+)$/.exec(e.target.id||''); if(m && e.key==='Enter'){ e.preventDefault(); const btn=app.querySelector(`button[data-act="add"][data-i="${m[1]}"]`); if(btn) btn.click(); } });
app.addEventListener('change', e=>{
  const t = e.target; if(!t.dataset.f) return;
  const g = S.goals[+t.dataset.i], f = t.dataset.f;
  g[f] = (f==='name'||f==='unit') ? t.value : Math.max(0, Number(t.value)||0);
  changed('Sozlama o‘zgardi');
});

  if(user) return `<p class="note">Bu sahifa faqat ko‘rish uchun. ${esc(user.email)} hisobida tahrir huquqi yo‘q. <button class="del" id="logout">Chiqish</button></p>`;
  let h = `<p class="note">Bu sahifa faqat ko‘rish uchun. O‘zgartirishlarni faqat egasi kiritadi. <button class="del" id="login">Egasi sifatida kirish</button></p>`;

    h += `<section class="log" style="padding:16px;display:flex;flex-direction:column;gap:10px;max-width:460px">

      <form id="eform" class="row" style="flex-wrap:nowrap"><input id="email" type="email" required placeholder="Gmail manzilingiz" autocomplete="email" aria-label="Gmail manzilingiz"><button class="gold" type="submit">Kirish havolasi</button></form>
      <div class="note">Pochtangizga kirish havolasi keladi — ustiga bossangiz, shu sahifaga kirgan holda qaytasiz.</div>

async function checkOwner(){
  canEdit = false;
  if(sb && user){
    try{ const { data, error } = await sb.rpc('men_egasimanmi'); canEdit = !error && data === true; }catch(e){}
  }
  if(!canEdit) editing = false;
}

async function load(){
  if(!sb) return;
  try{
    const { data, error } = await sb.from('maqsadlar').select('data').eq('id', 1).maybeSingle();
    if(!error && data && data.data && Array.isArray(data.data.goals) && !dirty){
      S = data.data; if(!Array.isArray(S.log)) S.log = [];
    }
  }catch(e){}
}

function changed(text){
  dirty = true; saveErr = ''; msg = text || '';
  render();
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 700);
}

async function save(){
  clearTimeout(saveTimer);
  if(!sb || saving || !dirty) return;
  saving = true; render();
  const snapshot = JSON.stringify(S);
  try{
    const { data, error } = await sb.from('maqsadlar').update({ data: JSON.parse(snapshot), updated_at: new Date().toISOString() }).eq('id', 1).select('id');
    if(error) throw error;
    if(!data || !data.length) throw { code: 'denied' };
    saveErr = '';
    if(JSON.stringify(S) === snapshot) dirty = false; else { saveTimer = setTimeout(save, 300); }
  }catch(err){
    saveErr = err && err.code === 'denied' ? 'Saqlanmadi: bu hisobda ruxsat yo‘q.' : 'Saqlanmadi: internetni tekshiring.';
  }
  saving = false; render();
}

app.addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b || !sb) return;
  if(b.id==='login'){ loginOpen = !loginOpen; msg=''; render(); const el=document.getElementById('email'); if(el) el.focus(); }
  else if(b.id==='logout'){ await sb.auth.signOut(); }
  else if(b.id==='glogin'){ await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin + location.pathname } }); }
});
app.addEventListener('submit', async e=>{
  if(e.target.id!=='eform') return;
  e.preventDefault();
  const email = document.getElementById('email').value.trim(); if(!email || !sb) return;
  msg = 'Yuborilmoqda…'; render();
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin + location.pathname } });
  msg = error ? 'Yuborib bo‘lmadi: ' + (error.message||'xato') : 'Havola yuborildi. Pochtangizni oching (Spam papkasini ham tekshiring).';
  render();
});
window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

render();
// Supabase javob bermasa 6 soniyadan keyin zaxira raqamlar ko'rsatiladi
const fallbackTimer = setTimeout(()=>{ if(!ready){ ready = true; intro = true; render(); } }, 6000);
(async()=>{
  const ok = window.supabase && CFG.SUPABASE_URL && CFG.SUPABASE_KEY && !/SIZNING|YOUR/.test(CFG.SUPABASE_URL + CFG.SUPABASE_KEY);
  if(!ok){ clearTimeout(fallbackTimer); ready = true; intro = true; render(); return; }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
  const { data:{ session } } = await sb.auth.getSession();
  user = session ? session.user : null;
  await Promise.all([load(), checkOwner()]);
  if(user) loginOpen = false;
  clearTimeout(fallbackTimer);
  if(!ready){ ready = true; intro = true; }
  render();
  sb.auth.onAuthStateChange((_ev, s)=>{
    const was = user && user.id; user = s ? s.user : null;
    if((user && user.id) === was) return;
    // Supabase qo'llanmasi: callback ichida boshqa so'rovlarni keyinga qoldirish kerak
    setTimeout(async ()=>{ await checkOwner(); if(user){ loginOpen=false; msg=''; } render(); }, 0);
  });
})();
})();
</script>
